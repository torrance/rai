[project]
name = "rai"
version = "0.1.0"
description = "Research AI: a local harness for non-fiction research and writing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "mcp>=1.2",
    "sqlite-vec>=0.1.6",
    "numpy>=1.26",
    "rapidfuzz>=3.9",
    "pyyaml>=6.0",
    "pymupdf>=1.24",
    "docling>=2.30",
    # Docling's layout models run on PyTorch. These two are listed directly only
    # so [tool.uv.sources] below can take them from PyTorch's CPU-only index:
    # no NVIDIA/CUDA libraries are installed, and nothing runs on a local GPU.
    "torch>=2.2.2",
    "torchvision",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "trafilatura>=1.12",
    "scikit-learn>=1.5",
]

[project.scripts]
rai = "rai.cli:app"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform != 'darwin'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rai"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live: runs against the real setup (Ollama, Zotero, OpenCode, APIs); needs --live",
    "slow: a slow live test; needs --slow as well",
    "agents: runs OpenCode agents; needs --agents as well",
]
